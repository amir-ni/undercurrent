name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built server
        env:
          GITHUB_TOKEN: smoke-test-placeholder # never used: no upstream call is made
          PORT: 8787
          DATABASE_PATH: /tmp/smoke.db
        run: |
          node --disable-warning=ExperimentalWarning src/index.ts &
          for i in $(seq 1 20); do curl -fsS localhost:8787/readyz && break; sleep 0.5; done
          curl -fsS localhost:8787/healthz
          curl -fsS localhost:8787/ | grep -q '<div id="root">'
          curl -fsS localhost:8787/metrics | grep -q http_requests_total
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/v1/repos/bad..name/x/insights)" = "400"
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: undercurrent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
